# asf-staging branch will show up at https://madlib.staged.apache.org
staging:
  profile:
  whoami: asf-staging

# asf-site branch will show up at https://madlib.apache.org
publish:
  whoami: asf-site
github:
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
